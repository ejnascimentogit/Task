<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Recibo</title>
<style>
  :root { --navy:#021F33; --green:#00FF7A; --bg:#F4F5F3; --card:#fff; --muted:#6B7280; --line:#E5E7EB; --text:#1a1a1a; --ok:#047857; --bad:#B91C1C; --warn:#B45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B1622; --card:#14212F; --muted:#94A3B8; --line:#24374D; --text:#E5E7EB; --ok:#34D399; --bad:#F87171; --warn:#FBBF24; } }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh; }
  header { background:var(--navy); color:#fff; padding:16px 20px; font-weight:800; letter-spacing:.02em; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:14px; }
  h1 { font-size:22px; margin-bottom:6px; }
  p.sub { color:var(--muted); font-size:14px; margin-bottom:14px; }
  .linha { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  .linha:first-of-type { border-top:0; }
  .linha span:first-child { color:var(--muted); }
  .linha b { text-align:right; }
  .valor { font-size:30px; font-weight:800; margin:6px 0 10px; }
  .selo { display:inline-block; font-weight:800; padding:6px 14px; border-radius:99px; font-size:14px; margin-bottom:12px; }
  .selo.ok { background:rgba(16,185,129,.15); color:var(--ok); } .selo.bad { background:rgba(220,38,38,.12); color:var(--bad); } .selo.warn { background:rgba(245,158,11,.16); color:var(--warn); }
  canvas { width:100%; height:220px; border:2px dashed var(--line); border-radius:12px; background:#fff; touch-action:none; display:block; }
  .acoes { display:flex; gap:10px; margin-top:12px; }
  button, .btn { font:inherit; font-weight:700; padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primario { flex:1; background:var(--green); color:var(--navy); border-color:var(--green); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text] { width:100%; font:inherit; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); text-transform:uppercase; letter-spacing:.1em; margin-bottom:10px; }
  .msg { margin-top:12px; font-size:14px; min-height:20px; }
  .mono { font-family:Consolas,monospace; font-size:11px; word-break:break-all; color:var(--muted); }
  .aviso { font-size:12.5px; color:var(--muted); margin-top:12px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>Taskfull · Recibo</header>
<main id="app"><div class="card"><p class="sub">Carregando…</p></div></main>
<script>
const SUPABASE_URL = 'https://dubbmmjtbunzmdmfbbja.supabase.co';
const SUPABASE_KEY = 'sb_publishable_txUpzlIpslm3DEh_GCFlBQ_WRl_BwHx';   // chave publishable/anon: segura de expor; as funções abaixo só devolvem o mínimo
const FORMAS = { pix: 'Pix', dinheiro: 'Dinheiro', debito: 'Cartão de débito', credito_vista: 'Cartão de crédito à vista', credito_parcelado: 'Cartão de crédito parcelado', transferencia: 'Transferência bancária' };
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dataBR = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
const quando = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' às ' + new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
async function rpc(nome, args) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + nome, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify(args) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
const q = new URLSearchParams(location.search);

function telaCodigo(erro) {
  app.innerHTML = `<div class="card"><h1>Conferir um recibo</h1><p class="sub">Digite o código que aparece no rodapé do recibo (ou leia o QR code).</p>
    <input type="text" id="cod" maxlength="12" placeholder="CÓDIGO" autocomplete="off"><button class="primario" style="width:100%" id="ok">Conferir</button>
    <div class="msg" style="color:var(--bad)">${esc(erro || '')}</div></div>`;
  document.getElementById('ok').onclick = () => { const c = document.getElementById('cod').value.trim(); if (c) location.search = '?c=' + encodeURIComponent(c); };
}

async function verificar(codigo) {
  document.title = 'Conferência de recibo';
  let d;
  try { d = await rpc('recibo_verificar', { p_codigo: codigo }); } catch (e) { return telaCodigo('Não foi possível consultar agora. Tente de novo em instantes.'); }
  if (!d.encontrado) return telaCodigo('Nenhum recibo encontrado com esse código.');
  const cancelado = d.status === 'cancelado';
  let selo;
  if (!d.integro) selo = '<span class="selo bad">⚠ Os dados NÃO conferem com o original</span>';
  else if (cancelado) selo = '<span class="selo warn">Recibo autêntico, mas CANCELADO</span>';
  else selo = '<span class="selo ok">✔ Recibo autêntico</span>';
  app.innerHTML = `<div class="card">${selo}<h1>Recibo nº ${String(d.numero).padStart(4, '0')}</h1>
    <div class="valor">${brl(d.valor)}</div>
    <div class="linha"><span>Emitido por</span><b>${esc(d.emissor_nome)}${d.emissor_documento ? '<br><small style="font-weight:400;color:var(--muted)">' + esc(d.emissor_documento.length === 14 ? d.emissor_documento.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : d.emissor_documento) + '</small>' : ''}</b></div>
    <div class="linha"><span>Recebido de</span><b>${esc(d.cliente_nome)}</b></div>
    <div class="linha"><span>Data</span><b>${dataBR(d.data_emissao)}</b></div>
    <div class="linha"><span>Pagamento</span><b>${esc(FORMAS[d.forma_pagamento] || d.forma_pagamento)}${d.forma_pagamento === 'credito_parcelado' ? ' · ' + d.parcelas + '×' : ''}</b></div>
    <div class="linha"><span>Assinatura do cliente</span><b>${d.assinado ? 'Sim · ' + quando(d.assinado_em) + (d.assinado_via === 'link' ? ' (por link)' : '') : 'Não houve'}</b></div>
    ${cancelado ? `<div class="linha"><span>Cancelado em</span><b>${quando(d.cancelado_em)}</b></div>` : ''}
    <p class="aviso">A conferência recalcula a “impressão digital” (SHA-256) do recibo a partir dos dados guardados e compara com a gravada na emissão. Se qualquer dado fosse alterado, ela deixaria de bater.</p>
    <p class="mono">${esc(d.hash)}</p></div>
    <div class="card"><p class="sub" style="margin:0">Recibo de pagamento: não substitui nota fiscal.</p></div>`;
}

const ERROS = { invalido: 'Este link não é válido.', usado: 'Este recibo já foi assinado. Obrigado!', cancelado: 'Este recibo foi cancelado.', expirado: 'Este link expirou. Peça um novo a quem emitiu o recibo.' };
async function assinar(token) {
  document.title = 'Assinar recibo';
  let d;
  try { d = await rpc('recibo_link_dados', { p_token: token }); } catch (e) { app.innerHTML = '<div class="card"><h1>Não foi possível abrir</h1><p class="sub">Tente de novo em instantes.</p></div>'; return; }
  if (d.erro) { app.innerHTML = `<div class="card"><h1>${esc(ERROS[d.erro] || 'Link indisponível.')}</h1></div>`; return; }
  app.innerHTML = `<div class="card"><h1>Assinar recibo nº ${String(d.numero).padStart(4, '0')}</h1><p class="sub">Confira os dados e assine com o dedo (ou o mouse) no quadro abaixo.</p>
    <div class="valor">${brl(d.valor)}</div>
    <div class="linha"><span>Emitido por</span><b>${esc(d.emissor_nome)}</b></div>
    <div class="linha"><span>Recebido de</span><b>${esc(d.cliente_nome)}</b></div>
    <div class="linha"><span>Data</span><b>${dataBR(d.data_emissao)}</b></div>
    <div class="linha"><span>Pagamento</span><b>${esc(FORMAS[d.forma_pagamento] || d.forma_pagamento)}${d.forma_pagamento === 'credito_parcelado' ? ' · ' + d.parcelas + '×' : ''}</b></div>
    ${d.descricao ? `<div class="linha"><span>Referente a</span><b>${esc(d.descricao)}</b></div>` : ''}</div>
    <div class="card"><canvas id="c"></canvas>
    <div class="acoes"><button id="limpar" type="button">Limpar</button><button class="primario" id="enviar" type="button">Assinar</button></div>
    <div class="msg" id="msg"></div>
    <p class="aviso">Ao assinar, o seu desenho, a data, a hora e o endereço de rede (IP) deste aparelho ficam registrados no recibo.</p></div>`;
  const c = document.getElementById('c'), b = c.getBoundingClientRect();
  c.width = Math.round(b.width * 2); c.height = Math.round(b.height * 2);
  const ctx = c.getContext('2d'); ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d3b6f';
  let desenhando = false, tem = false;
  const pos = ev => { const r = c.getBoundingClientRect(); return [(ev.clientX - r.left) * c.width / r.width, (ev.clientY - r.top) * c.height / r.height]; };
  c.addEventListener('pointerdown', ev => { desenhando = true; c.setPointerCapture(ev.pointerId); const [x, y] = pos(ev); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .1, y + .1); ctx.stroke(); tem = true; });
  c.addEventListener('pointermove', ev => { if (!desenhando) return; const [x, y] = pos(ev); ctx.lineTo(x, y); ctx.stroke(); });
  const fim = () => { desenhando = false; }; c.addEventListener('pointerup', fim); c.addEventListener('pointercancel', fim);
  document.getElementById('limpar').onclick = () => { ctx.clearRect(0, 0, c.width, c.height); tem = false; };
  const msg = document.getElementById('msg');
  document.getElementById('enviar').onclick = async function () {
    if (!tem) { msg.style.color = 'var(--bad)'; msg.textContent = 'Desenhe a sua assinatura no quadro.'; return; }
    this.disabled = true; msg.style.color = ''; msg.textContent = 'Enviando…';
    try {
      const r = await rpc('recibo_link_assinar', { p_token: token, p_img: c.toDataURL('image/png') });
      if (r.ok) { app.innerHTML = '<div class="card"><span class="selo ok">✔ Assinado</span><h1>Obrigado!</h1><p class="sub">Sua assinatura foi registrada no recibo. Você já pode fechar esta página.</p></div>'; return; }
      msg.style.color = 'var(--bad)'; msg.textContent = r.erro || 'Não foi possível assinar.'; this.disabled = false;
    } catch (e) { msg.style.color = 'var(--bad)'; msg.textContent = 'Sem conexão. Tente de novo.'; this.disabled = false; }
  };
}

if (q.get('t')) assinar(q.get('t').trim());
else if (q.get('c')) verificar(q.get('c').trim());
else telaCodigo();
</script>
</body>
</html>
