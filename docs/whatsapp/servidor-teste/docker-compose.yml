# Servidor de TESTE do WuzAPI (WhatsApp) — para rodar num Codespace (nuvem), nunca na máquina da empresa.
# Sobe o WuzAPI (construído direto do repositório oficial) + PostgreSQL (onde ficam as sessões do WhatsApp).
# Não inclui o RabbitMQ do modelo oficial (opcional; o Taskfull não usa).
# Os segredos ficam no arquivo .env (criado por ./gerar-env.sh, nunca vai para o Git).
services:
  wuzapi:
    build:
      context: https://github.com/asternic/wuzapi.git#main
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${WUZAPI_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  db_data:
